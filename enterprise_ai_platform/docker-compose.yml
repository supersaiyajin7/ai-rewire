version: "3.8"

services:
  localstack:
    container_name: localstack_main
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - platform_network

  # 🔑 LOCAL OAUTH2 / OIDC PROVIDER (Keycloak)
  keycloak:
    container_name: keycloak_auth_server
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      # Exposes UI/Token endpoints to your host machine & Postman
      - "127.0.0.1:8080:8080"
    networks:
      - platform_network

  api_platform:
    container_name: ai_platform_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Keycloak URL for internal container-to-container verification
      - KEYCLOAK_DOMAIN=http://keycloak:8080
      - KEYCLOAK_REALM=my-platform
    depends_on:
      - localstack
      - keycloak
    volumes:
      - .:/workspace
    networks:
      - platform_network

  # 🔥 PHASE 1 LAYER 3: Background Worker - Polls SQS, processes jobs, updates DynamoDB
  ai_platform_worker:
    container_name: ai_platform_worker
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-u", "worker.py"]
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - localstack
      - keycloak
    volumes:
      - .:/workspace
    networks:
      - platform_network

  # 🔥 THE DYNAMODB VISUAL MANAGER: Displays tables, keys, and row attributes natively
  localstack_gui:
    container_name: localstack_dashboard_ui
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=mock_id
      - AWS_SECRET_ACCESS_KEY=mock_secret
    depends_on:
      - localstack
    networks:
      - platform_network

networks:
  platform_network:
    name: platform_architecture_net

volumes:
  localstack: